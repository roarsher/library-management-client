 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#063B70"
    />

    <meta
      name="description"
      content="Gyan Library is a modern study library and reading room offering comfortable study spaces, seat booking, Wi-Fi, CCTV, AC, power backup and other student-friendly facilities."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://gyanlibrary.in/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="Gyan Library - Study Library & Reading Room"
    />

    <meta
      property="og:description"
      content="Gyan Library is a modern study library and reading room offering comfortable study spaces, seat booking, Wi-Fi, CCTV, AC and power backup."
    />

    <meta
      property="og:url"
      content="https://gyanlibrary.in/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="https://gyanlibrary.in/logo.png"
    />

    <meta
      property="og:site_name"
      content="Gyan Library"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Gyan Library - Study Library & Reading Room"
    />

    <meta
      name="twitter:description"
      content="Modern study library and reading room with comfortable study spaces and student-friendly facilities."
    />

    <meta
      name="twitter:image"
      content="https://gyanlibrary.in/logo.png"
    />

    <!-- Google Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Gyan Library",
        "alternateName": "Gyan Library Study Centre",
        "url": "https://gyanlibrary.in/",
        "logo": "https://gyanlibrary.in/logo.png"
      }
    </script>

    <title>Gyan Library - Study Library & Reading Room</title>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
